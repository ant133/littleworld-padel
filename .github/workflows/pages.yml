name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module boundaries
        run: node tools/dupcheck.js
      - name: Build online and offline pages
        run: node tools/build.js
      - name: Check physics, scoring, and player AI
        run: |
          node tools/physics_tests.js
          node tools/scoring_tests.js
          node tools/player_ai_tests.js
      - name: Prepare published files
        run: |
          mkdir -p _site
          cp dist/littleworld-online.html _site/index.html
          cp dist/littleworld-offline.html _site/littleworld-offline.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
