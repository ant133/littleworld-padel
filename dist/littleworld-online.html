<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf0"><meta name="description" content="A physics-driven 3D pixel-art doubles padel diorama. Made in Jakarta."><title>Littleworld Jakarta Padel Cup</title><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2228%22%20height%3D%2228%22%20fill%3D%22%23fff4b3%22%20stroke%3D%22%23123954%22%20stroke-width%3D%223%22%2F%3E%3Ctext%20x%3D%227%22%20y%3D%2223%22%20font-family%3D%22Arial%2Csans-serif%22%20font-weight%3D%22800%22%20font-size%3D%2219%22%20fill%3D%22%23123954%22%3EA%3C%2Ftext%3E%3Ctext%20x%3D%2219%22%20y%3D%2215%22%20font-size%3D%2211%22%20fill%3D%22%23177dc5%22%3E%E2%9C%A6%3C%2Ftext%3E%3C%2Fsvg%3E"><style>
/* Littleworld Jakarta Padel Cup - page chrome (annetta.dev look, light theme). Pixel art lives only inside the canvas. */
:root{
  --ink:#123954;--blue:#177dc5;--cream:#fffaf0;--accent:#268cc2;--tag:#257bad;--hl:#fff4b3;--hair:#12395421;
  --coral:#f39979;--shadow:15px 18px 0 #1264992e;--card:#fffaf0f0;--sky:#c9edf2;--good:#2f9e6a;--bad:#d2493f;
  --head:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font:14px/1.45 var(--body);-webkit-text-size-adjust:100%}
body{overflow-x:hidden;background:var(--cream) radial-gradient(circle at 18% 0,#fff4b34d,transparent 40%)}
button,select,input{font:inherit;color:inherit}
a{color:var(--blue)}
h1,h2,h3{font-family:var(--head);font-weight:800;letter-spacing:-.04em;margin:0}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}

#app{min-height:100vh;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:14px;height:52px;padding:0 16px;border-bottom:1px solid var(--hair);background:var(--cream);flex:none}
#topbar .logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);flex:none}
#topbar .mark{display:grid;place-items:center;width:30px;height:30px;border:2px solid var(--ink);font:800 15px var(--head);letter-spacing:-.06em;background:var(--hl);transform:rotate(-3deg)}
#topbar .mark i{font-style:normal;color:var(--blue);font-size:11px;margin-left:1px}
#topbar .back{font-size:12px;letter-spacing:.02em}
#topbar .logo:hover .back{text-decoration:underline}
#title{font-size:clamp(15px,2.4vw,20px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;text-align:center}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--hair);background:var(--card);font-size:11px;font-weight:600;letter-spacing:.04em}
.icon-btn{width:30px;height:30px;border:1px solid var(--ink);background:var(--cream);font-weight:800;cursor:pointer;padding:0}
.icon-btn:hover{background:var(--hl)}

#layout{flex:1;display:flex;flex-direction:column;min-height:0}
#stagewrap{position:relative;padding:10px 12px 18px 10px}
#stage{position:relative;height:62vh;height:62svh;min-height:320px;overflow:hidden;background:var(--sky);border:1px solid var(--hair);box-shadow:6px 8px 0 #1264992e;user-select:none;-webkit-user-select:none;touch-action:none}
#stage canvas{display:block}
#panel{position:relative;background:var(--cream);border-top:1px solid var(--hair);padding:0 12px 24px}

@media (min-width:900px){
  #app{height:100vh;min-height:0}
  #layout{flex-direction:row;overflow:hidden}
  #stagewrap{flex:1;min-width:0;padding:16px 30px 34px 16px}
  #stage{position:absolute;left:16px;right:30px;top:16px;bottom:34px;height:auto;min-height:0;box-shadow:var(--shadow)}
  #panel{flex:none;width:clamp(360px,28vw,400px);overflow-y:auto;overflow-x:hidden;border-top:0;border-left:1px solid var(--hair);padding:0 16px 24px;scrollbar-width:thin}
}

/* ---------- tags, buttons, fields ---------- */
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:var(--tag)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:6px 12px;border:1px solid var(--ink);background:var(--cream);cursor:pointer;font-weight:600;font-size:13px;line-height:1.1;transition:transform .1s,box-shadow .1s,background .15s}
.btn:hover{background:var(--hl)}
.btn:active{transform:translate(1px,1px)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;background:var(--cream)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--ink);box-shadow:3px 3px 0 var(--ink);font-family:var(--head);font-weight:800;letter-spacing:-.02em}
.btn.primary:hover{background:var(--accent)}
.btn.primary:active{box-shadow:1px 1px 0 var(--ink);transform:translate(2px,2px)}
.btn.small{min-height:28px;padding:3px 9px;font-size:12px}
.btn.block{width:100%}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:0}
.seg button{flex:1 1 auto;min-height:32px;padding:5px 9px;border:1px solid var(--ink);margin-left:-1px;background:var(--cream);cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap}
.seg button:first-child{margin-left:0}
.seg button:hover{background:var(--hl)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--cream)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.preset-grid button{min-height:34px;padding:5px 8px;border:1px solid var(--hair);background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;text-align:left;line-height:1.15}
.preset-grid button:hover{border-color:var(--ink);background:var(--hl)}
.preset-grid button[aria-pressed=true]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.field{display:grid;gap:4px;margin:10px 0}
.field>label,.field>.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
select,input[type=text],input[type=number]{width:100%;min-height:34px;padding:5px 24px 5px 8px;text-overflow:ellipsis;border:1px solid var(--ink);background:#fff;border-radius:0;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
input[type=text],input[type=number]{background-image:none}
select option:disabled{color:#12395466}
input[type=range]{width:100%;accent-color:var(--blue);height:28px;margin:0}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.switch{display:flex;align-items:center;gap:9px;min-height:32px;cursor:pointer;font-size:13px;font-weight:500}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .box{flex:none;width:34px;height:18px;border:1px solid var(--ink);background:#fff;position:relative;transition:background .15s}
.switch .box::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--ink);transition:transform .15s}
.switch input:checked+.box{background:var(--blue)}
.switch input:checked+.box::after{transform:translateX(16px);background:#fff}
.switch input:focus-visible+.box{outline:2px solid var(--blue);outline-offset:2px}
.hint{font-size:11.5px;opacity:.7;margin:4px 0 0}
.keycap{display:inline-block;min-width:18px;padding:0 5px;border:1px solid var(--ink);border-bottom-width:2px;background:#fff;font:700 10px/16px var(--mono);text-align:center}

/* ---------- panel ---------- */
.panel-head{position:sticky;top:0;z-index:20;margin:0 -16px;padding:10px 16px 10px;background:var(--cream);border-bottom:1px solid var(--hair)}
@media (max-width:899px){.panel-head{margin:0 -12px;padding:10px 12px}}
.panel-head .row{display:flex;gap:8px;align-items:stretch}
.panel-head .row+.row{margin-top:8px}
.panel-head .primary{flex:1;min-height:42px;font-size:15px}
.speed{flex:1}
.speed button{padding:4px 2px;min-width:0}
.sec{border:1px solid var(--hair);background:var(--card);margin-top:12px}
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:44px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:'+';margin-left:auto;font:800 16px var(--head);width:20px;text-align:center}
.sec[open]>summary::after{content:'\2212'}
.sec>summary h2{font-size:16px}
.sec .body{padding:2px 12px 14px;border-top:1px solid var(--hair)}
.sec.pulse{animation:pulse 1.2s ease-in-out 3;box-shadow:0 0 0 3px var(--hl)}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--hl)}}
.sub{margin:14px 0 4px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tag)}
#foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--hair);font-size:11.5px}
#foot p{margin:4px 0 0;font-family:Georgia,serif;font-style:italic;opacity:.8}
.pickers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pickers .team-tag{grid-column:1/-1;display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:10px;height:10px;background:var(--blue)}
.dot.b{background:var(--coral)}
details.adv{margin-top:8px;border-top:1px dashed var(--hair);padding-top:6px}
details.adv>summary{cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.7;min-height:28px;display:flex;align-items:center}

/* ---------- match centre ---------- */
.tabs{display:flex;margin:10px 0 8px;border-bottom:1px solid var(--ink)}
.tabs button{flex:1;min-height:34px;border:0;background:none;cursor:pointer;font-weight:700;font-size:12.5px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{border-bottom-color:var(--blue);color:var(--blue)}
.tabpane{display:none}.tabpane.on{display:block}
.score-card{display:grid;gap:6px;font-size:13px}
.score-card .line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--hair);padding:3px 0}
.score-card .line b{font-family:var(--head)}
.stats{width:100%;border-collapse:collapse;font-size:12.5px}
.stats th{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--tag);padding:4px 2px;text-align:center}
.stats td{padding:4px 2px;border-bottom:1px solid var(--hair);text-align:center;font-variant-numeric:tabular-nums}
.stats td.l{text-align:center;font-size:11.5px;opacity:.75;width:42%}
.stats td.v{font-weight:600;width:29%;position:relative}
.stats td.v.lead{font-weight:800;color:var(--blue)}
.stats td.v.lead.b{color:#c4553a}
.stats tr.sec-row td{padding-top:10px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--tag);border-bottom:1px solid var(--ink);text-align:left}
.contrib{display:grid;gap:5px;margin-top:6px}
.contrib .c{display:grid;grid-template-columns:84px 1fr 34px;gap:6px;align-items:center;font-size:12px}
.contrib .bar{height:10px;background:#12395410;position:relative}
.contrib .bar i{position:absolute;top:0;bottom:0;left:50%;background:var(--blue)}
.contrib .bar i.neg{background:var(--bad)}
.contrib .bar i.b{background:var(--coral)}
.contrib .bar::before{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink)}
.pcards{display:grid;gap:10px}
.pcard{border:1px solid var(--hair);background:#fff;padding:10px;display:grid;grid-template-columns:72px 1fr;gap:10px}
.pcard.a{border-left:4px solid var(--blue)}.pcard.b{border-left:4px solid var(--coral)}
.pcard canvas{width:72px;height:72px;image-rendering:pixelated;border:1px solid var(--hair);background:var(--sky)}
.pcard .nm{font:800 14px/1.1 var(--head);letter-spacing:-.03em}
.pcard .meta{font-size:11px;opacity:.75;margin-top:2px}
.pcard .bars{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin-top:2px}
.mbar{display:grid;grid-template-columns:50px 1fr 22px;gap:5px;align-items:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.mbar .t{height:6px;background:#12395414}
.mbar .t i{display:block;height:100%;background:var(--blue)}
.mbar.live .t i{background:var(--good)}
.mbar.fat .t i{background:var(--coral)}
.pcard .mini{grid-column:1/-1;font-size:11.5px;display:flex;gap:12px;flex-wrap:wrap;opacity:.9}
.feedbar{display:flex;gap:6px;margin-bottom:8px}
.feed{max-height:340px;overflow:auto;border:1px solid var(--hair);background:#fff;scrollbar-width:thin}
.feed .it{display:grid;grid-template-columns:20px 1fr auto;gap:6px;padding:5px 8px;border-bottom:1px solid var(--hair);font-size:12.5px;align-items:baseline}
.feed .it .ic{text-align:center;color:var(--tag);font-weight:800}
.feed .it.key{background:#fff4b366}
.feed .it .tm{font-size:10.5px;opacity:.55;font-variant-numeric:tabular-nums}
.feed.keyonly .it:not(.key){display:none}
.feed .empty{padding:14px;opacity:.6;font-size:12.5px}

/* ---------- TV scoreboard overlay ---------- */
#sb{position:absolute;left:12px;top:12px;z-index:6;max-width:calc(100% - 24px);pointer-events:none;font-family:var(--head)}
.sb-card{position:relative;display:inline-block;min-width:210px;background:#fffaf0f2;border:1px solid var(--ink);box-shadow:5px 6px 0 #1264992e}
.sb-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 8px;background:var(--ink);color:var(--cream);font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
.sb-top .ph{color:var(--hl)}
.sb-row{position:relative;display:flex;align-items:stretch;border-top:1px solid var(--hair);min-height:40px}
.sb-row:first-of-type{border-top:0}
.sb-row::before{content:'';flex:none;width:5px;background:var(--blue)}
.sb-row.b::before{background:var(--coral)}
.sb-srv{flex:none;width:14px;display:grid;place-items:center}
.sb-srv i{display:block;width:8px;height:8px;border-radius:50%;background:transparent;border:1px solid transparent}
.sb-srv i.on{background:#e8c800;border-color:var(--ink);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{transform:scale(1.25)}}
.sb-names{flex:1;min-width:0;padding:3px 8px 3px 2px;display:grid;align-content:center;gap:1px}
.sb-p{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;line-height:1.15}
.sb-p.srv{color:var(--blue)}
.sb-cell{flex:none;min-width:24px;display:grid;place-items:center;padding:0 5px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;border-left:1px solid var(--hair)}
.sb-cell.dim{opacity:.55;font-weight:600}
.sb-cell.win{color:var(--blue)}
.sb-cell.g{background:#12395410}
.sb-pts{flex:none;min-width:44px;display:grid;place-items:center;background:var(--ink);color:var(--cream);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;overflow:hidden}
.sb-pts span,.sb-cell span{display:inline-block}
.flip{animation:flipin .42s cubic-bezier(.2,.9,.3,1.2)}
@keyframes flipin{0%{transform:translateY(-70%) rotateX(80deg);opacity:0}100%{transform:none;opacity:1}}
.flag{position:relative;flex:none;display:inline-block;width:18px;height:12px;border:1px solid #12395466;background:#ddd;overflow:hidden;box-shadow:0 1px 0 #12395422}
.flag-ESP{background:linear-gradient(#c81d25 0 25%,#f5d90a 25% 75%,#c81d25 75%)}
.flag-ARG{background:linear-gradient(#74c0ec 0 33.3%,#fff 33.3% 66.6%,#74c0ec 66.6%)}
.flag-IDN{background:linear-gradient(#e0262d 0 50%,#fff 50%)}
.flag-NED{background:linear-gradient(#ae1c28 0 33.3%,#fff 33.3% 66.6%,#21468b 66.6%)}
.flag-JPN{background:radial-gradient(circle at 50% 50%,#c81d25 0 26%,#fff 28%)}
.flag-SWE{background:linear-gradient(#f5d90a,#f5d90a) 0 50%/100% 26% no-repeat,linear-gradient(#f5d90a,#f5d90a) 28% 0/22% 100% no-repeat,#1f5fae}
.flag-ITA{background:linear-gradient(90deg,#1e9b4f 0 33.3%,#fff 33.3% 66.6%,#d6322b 66.6%)}
.flag-BRA{background:#1e9b4f}
.flag-BRA::after{content:'';position:absolute;inset:1px 3px;background:#f5d90a;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.flag-FRA{background:linear-gradient(90deg,#2a4ea2 0 33.3%,#fff 33.3% 66.6%,#d6322b 66.6%)}
.flag-GER{background:linear-gradient(#222 0 33.3%,#d6322b 33.3% 66.6%,#f5c400 66.6%)}
.flag-POR{background:linear-gradient(90deg,#1e9b4f 0 40%,#d6322b 40%)}
.flag-CHI{background:linear-gradient(#fff 0 50%,#d6322b 50%)}
.flag-AUS{background:#1f3a8a}
.flag-GBR{background:linear-gradient(#fff,#fff) 0 50%/100% 30% no-repeat,linear-gradient(#fff,#fff) 50% 0/22% 100% no-repeat,linear-gradient(#d6322b,#d6322b) 0 50%/100% 14% no-repeat,linear-gradient(#d6322b,#d6322b) 50% 0/10% 100% no-repeat,#1f3a8a}
.sb-info{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:4px 6px;border-top:1px solid var(--ink);background:#fffaf0}
.sb-info .chip{font-size:10px;padding:1px 6px;font-family:var(--body);background:#fff}
.sticker{position:absolute;z-index:3;right:-8px;padding:2px 7px;border:2px solid var(--blue);background:var(--hl);color:var(--ink);font:800 10px var(--head);letter-spacing:.1em;text-transform:uppercase;transform:rotate(-3deg);white-space:nowrap;box-shadow:2px 2px 0 #12649933;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.sticker.gp{position:static;display:inline-block;transform:rotate(-3deg)}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg);opacity:0}100%{transform:rotate(-3deg);opacity:1}}
.sb-row .stk{position:absolute;right:-6px;top:-8px;display:flex;gap:4px}
.sb-row .stk .sticker{position:static}

/* floating stage bits */
#toasts{position:absolute;right:12px;top:12px;z-index:8;display:grid;gap:6px;justify-items:end;pointer-events:none;max-width:min(320px,calc(100% - 24px))}
.toast{padding:7px 11px;border:1px solid var(--ink);background:var(--cream);box-shadow:3px 4px 0 #1264992e;font-size:12.5px;font-weight:600;animation:toastin .3s ease-out;line-height:1.3}
.toast.good{border-left:6px solid var(--good)}.toast.warn{border-left:6px solid var(--coral)}.toast.info{border-left:6px solid var(--blue)}
.toast.out{opacity:0;transform:translateX(12px);transition:.35s}
@keyframes toastin{from{opacity:0;transform:translateY(-8px)}}
#fab{position:absolute;right:12px;bottom:12px;z-index:7;display:flex;gap:6px}
#fab .btn{min-height:36px;box-shadow:3px 3px 0 var(--ink);background:var(--cream)}
#fab .btn.primary{background:var(--blue)}
#banner{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);z-index:6;padding:8px 16px;border:2px solid var(--ink);background:var(--hl);font:800 16px var(--head);letter-spacing:-.02em;pointer-events:none;text-align:center;box-shadow:4px 4px 0 #12399433}
#banner small{display:block;font:600 11px var(--body);letter-spacing:.02em}
#banner button{pointer-events:auto;margin-top:4px}
.aimhud{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:7;padding:6px 12px;background:var(--ink);color:var(--cream);font-size:12px;font-weight:700;letter-spacing:.04em;pointer-events:none}
#stage.aiming{cursor:crosshair}
#aimmark{position:absolute;z-index:5;width:30px;height:30px;margin:-15px 0 0 -15px;pointer-events:none;border:3px solid #e8c800;border-radius:50%;box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--ink);animation:aim 1s ease-in-out infinite}
#aimmark::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;background:var(--ink)}
@keyframes aim{50%{transform:scale(1.35);opacity:.75}}
#debug{position:absolute;left:10px;bottom:10px;z-index:9;max-width:min(520px,calc(100% - 20px));padding:6px 8px;background:#123954e6;color:#e8f6ff;font:11px/1.35 var(--mono);white-space:pre;overflow:hidden;pointer-events:none}

/* modal */
.modal{position:absolute;inset:0;z-index:12;display:grid;place-items:center;padding:12px;background:#12395455;overflow:auto}

      ['A', 'B'].forEach(function (t) { tickTeam(t, dt); });
    },

    servePositions(servingTeam, serverId, side, receiverId) {
      const P = HPO.mod.players, out = {};
      const rec = opp(servingTeam);
      const sx = HPO.court.sides[servingTeam], rx = HPO.court.sides[rec];
      const rs = HPO.court.rightSign(servingTeam);
      const sgn = side === 'ad' ? -1 : 1;
      const server = P.byId[serverId], partner = P.other(server);
      const lane = rs * sgn;
      out[partner.id] = { x: sx * 2.6, z: -lane * 2.1 };
      const box = HPO.court.serviceBox(servingTeam, side);
      const bz = (box.z[0] + box.z[1]) / 2;
      const rcv = (receiverId && P.byId[receiverId]) || chooseReceiver(rec, bz);
      const rp = P.other(rcv);
      out[rcv.id] = { x: rx * 8.0, z: bz > 0 ? 2.4 : -2.4 };
      out[rp.id] = { x: rx * SERVE_BACK, z: bz > 0 ? -2.0 : 2.0 };   // both receivers start behind the service line (6.95 m)
      return { map: out, receiver: rcv.id };
    },

    chooseStrike(p, cands) {
      const t = teams[p.team], m = mods(p.team), deepLob = backGlassLob(p);
      const depth = Math.abs(p.pos.x);
      const atNet = depth < 4.2;
      let best = null, bs = -1e9;
      const rr = rgn();
      cands.forEach(function (c) {
        const y = c.p.y, d = Math.abs(c.p.x);
        let s = 0;
        s += Math.min(c.slack, 0.8) * 1.2;                         // time to set up
        s -= Math.abs(y - (atNet ? 1.35 : 1.0)) * 0.9;              // comfortable contact height
        if (y >= 2.1 && y <= 2.95) s += (deepLob ? 4.0 : 1.8) * m.smash;
        if (c.ownBounces === 0) s += atNet ? 0.9 * T.volleyWilling * (1 + (m.netBias > 0 ? 0.3 : 0)) : -0.5; // volley when at the net
        if (c.afterWall) s += lvl(p.attrs.wallRead) * 0.6 - (atNet ? 0.5 : 0);   // wall specialists let it come back
        if (c.ownBounces === 0 && c.dt < 0.25) s -= 0.5;              // too rushed
        if (d < 1.0) s -= 0.6;                                       // too close to net / body in the net
        if (c.reach > 0.9) s -= (c.reach - 0.9) * 1.5;
        s += rr.range(-0.1, 0.1);
        if (s > bs) { bs = s; best = c; }
      });
      return best;
    },

    warmup: false,
    warmupShot(p, info) {
      const rr = rgn(), ox = -HPO.court.sides[p.team], depth = Math.abs(p.pos.x), h = info.height;
      let kind = h >= 1.85 ? 'bandeja' : (depth < 4.5 && h > 0.5 ? (info.fh ? 'volleyFH' : 'volleyBH') : rr.pick(['flatGround', 'topGround', 'slice', 'slice', 'topGround']));
      if (depth > 6.5 && h < 1.2 && rr.chance(0.18)) kind = 'lobDef';
      const tx = ox * (kind === 'lobDef' ? 7.2 : rr.range(5.0, 7.0)), tz = U.clamp(-p.pos.z * 0.4 + rr.range(-1.2, 1.2), -2.6, 2.6);
      return { kind: kind, target: { x: tx, z: tz }, effort: 0.25, intent: 'warmup', reason: 'warmup', warm: true, netMargin: 0.3 };
    },
    decideShot(p, info) {
      if (AI.warmup) return AI.warmupShot(p, info);
      const S = HPO.mod.shots, P = HPO.mod.players;
      const team = p.team, m = mods(team), tm = teams[team];
      const ox = -HPO.court.sides[team];                 // sign of opponent half
      const ops = P.team(opp(team));
      const depth = Math.abs(p.pos.x), h = info.height;
      const oppNet = ops.filter(q => Math.abs(q.pos.x) < 4.0).length;
      const press = U.clamp(1 - info.slack / 0.45, 0, 1);
      const sc = scoreState();
      const w = {};
      const high = h >= 1.85, low = h < 0.95;
      const near = depth < 4.5, mid = depth >= 4.5 && depth < 6.5, deep = depth >= 6.5;
      const deepLob = backGlassLob(p);
      if (deepLob && h >= 2.1 && h <= 3.0) {
        const kick = aimFor(p, 'smashKick', info, ops, oppNet, press, m, tm);
        if (S.nominal(info.p, kick.kind, kick.target, { effort: kick.effort }).feasible) { tm.aim = null; kick.reason = 'back-glass-lob'; return kick; }
      }

      if (high) {
        const okSmash = (depth <= T.smashDepthMax && h >= 2.05) ? 1 : 0.03;
        w.smashFlat = 3.6 * okSmash * m.smash; w.smashKick = 2.8 * okSmash * m.smash;
        w.bandeja = 2.6 * m.bandeja * (deep ? 1.1 : 1); w.vibora = 1.5 * m.vibora * (near ? 1.2 : 0.7);
        w.lobOff = deep ? 1.0 * m.lob : 0.35 * m.lob;
        if (info.afterWall && deep) w.bajada = 1.2;
      } else if (near && !low) {
        w.volleyFH = w.volleyBH = 3.0 * m.volley;
        w.chiquita = (h < 1.15 ? 1.1 : 0.4) * m.chiquita;
        w.dejada = 0.5 * (ops.every(q => Math.abs(q.pos.x) > 5.5) ? 2 : 0.3);
        w.lobOff = 0.35 * m.lob * (oppNet >= 1 ? 1.4 : 0.6);
      } else if (near && low) {
        w.chiquita = 2.6 * m.chiquita; w.volleyFH = w.volleyBH = 1.4 * m.volley; w.lobDef = 1.0 * m.lob;
      } else {
        w.flatGround = 1.0 * m.flat; w.topGround = 1.7; w.slice = 1.3 * m.slice;
        w.lobDef = (T.lobBase + 1.1 * oppNet + 1.3 * press) * m.lob;
        w.lobOff = 0.5 * m.lob * (oppNet ? 1.2 : 0.4);
        w.chiquita = (oppNet >= 1 && h < 1.15 && mid) ? 1.0 * m.chiquita : 0.0;
        if (info.afterWall && h > 0.85 && deep) w.bajada = 2.0;
        if (info.afterWall && press > 0.5) w.wallDef = 1.8 * m.wallDef;
        if (info.walls >= 2 && info.slack > 0.12) w.counterDW = 1.3;
        if (mid && h > 0.6) w.volleyFH = w.volleyBH = 0.8 * m.volley;
      }
      Object.keys(w).forEach(k => { if (LOB[k]) w[k] *= deepLob ? 0 : 0.55; });
      if (oppNet >= 2) { if (w.flatGround) w.flatGround *= 0.55; if (w.topGround) w.topGround *= 0.7; }
      if (w.volleyFH !== undefined) { if (info.fh) w.volleyBH = 0; else w.volleyFH = 0; }

      const arch = p.def.archetype;
      Object.keys(w).forEach(function (k) {
        let x = w[k];
        if (!(x > 0)) { w[k] = 0; return; }
        if (arch === 'netAttacker') { if (k.indexOf('volley') === 0) x *= 1.3; if (k === 'vibora') x *= 1.4; if (k === 'bandeja') x *= 1.1; }
        if (arch === 'wallSpecialist') { if (k === 'lobDef' || k === 'wallDef') x *= 1.35; if (k === 'bajada') x *= 1.2; if (k === 'slice') x *= 1.2; }
        if (arch === 'smasher') { if (SMASH[k]) x *= 1.6; if (k === 'vibora') x *= 1.25; }
        if (arch === 'precision') { if (SOFT[k]) x *= 1.4; if (k === 'bandeja') x *= 1.15; }
        if (arch === 'counterpuncher') { if (k === 'counterDW') x *= 1.6; if (LOB[k]) x *= 1.2; }
        const diff = S.difficulty(k, h, info.ballSpeed, 0);
        x *= S.heightFit(k, h) + 0.02;
        x *= (1 - U.clamp(diff - 0.3 * lvl(p.attrs.accuracy), 0, 1) * (0.5 + press * 0.5));
        if (SMASH[k] && sc.pressure > 0.6) x *= 0.85;
        w[k] = Math.pow(Math.max(x, 0), 1 + T.sharp * lvl(p.attrs.tactics));
      });
      const kinds = Object.keys(w).filter(k => w[k] > 0);
      let kind;
      if (!kinds.length) kind = 'lobDef'; else kind = rgn().weighted(kinds, k => w[k]);

      let pick = aimFor(p, kind, info, ops, oppNet, press, m, tm);
      const rd = tm.orders.returnDir;
      if (rd && rd !== 'auto' && HPO.mod.ball.state.hitsSinceServe === 1) {
        const side = p.pos.z >= 0 ? 1 : -1;
        if (rd === 'lob') pick = aimFor(p, 'lobDef', info, ops, oppNet, press, m, tm);
        else if (rd === 'middle') pick.target = { x: pick.target.x, z: side * 0.4 };
        else if (rd === 'line') pick.target = { x: pick.target.x, z: side * 2.8 };
        else if (rd === 'crosscourt') pick.target = { x: pick.target.x, z: -side * 2.8 };
        pick.reason = 'coach-return';
      }
      const S2 = HPO.mod.shots;
      let nom = S2.nominal(info.p, pick.kind, pick.target, { effort: pick.effort, netMargin: pick.netMargin });
      if (!nom.feasible) {
        const fb = high ? ['smashKick', 'smashFlat', 'bandeja', 'vibora'] : (near ? ['volley', 'chiquita', 'flatGround'] : ['slice', 'flatGround', 'topGround']);
        for (let i = 0; i < fb.length; i++) {
          let k = fb[i]; if (k === 'volley') k = info.fh ? 'volleyFH' : 'volleyBH';
          const alt = aimFor(p, k, info, ops, oppNet, press, m, tm);
          const n2 = S2.nominal(info.p, alt.kind, alt.target, { effort: alt.effort });
          if (n2.feasible) { pick = alt; break; }
        }
      }
      tm.aim = null;
      return pick;
    }
  };

  function scoreState() {
    const R = HPO.mod.rules;
    let pressure = 0;
    try { if (R && R.state && R.state.flags) { const f = R.state.flags; if (f.matchPoint || f.setPoint || f.breakPoint || R.state.goldenPoint) pressure = 0.7; } } catch (e) { /* ignore */ }
    return { pressure: pressure };
  }

  function chooseReceiver(recTeam, boxZ) {
    const P = HPO.mod.players, ps = P.team(recTeam);
    const rs = HPO.court.rightSign(recTeam);
    const wantRight = (boxZ * rs) > 0;
    let best = ps[0], bs = -9;
    ps.forEach(function (q) {
      let s = 0;
      if (q.def.side === 'drive') s += wantRight ? 1 : -1; else if (q.def.side === 'reves') s += wantRight ? -1 : 1;
      s += lvl(q.attrs.defense) * 0.3 - q.fatigue; s += rgn().range(0, 0.05);
      if (s > bs) { bs = s; best = q; }
    });
    return best;
  }

  function aimFor(p, kind, info, ops, oppNet, press, m, tm) {
    const S = HPO.mod.shots, ox = -HPO.court.sides[p.team];
    const acc = lvl(p.attrs.accuracy);
    const kEst = S.sigmaK(HPO.mod.players.execCtx(p, S.difficulty(kind, info.height, info.ballSpeed, 0), press, 0.1));
    const dist = Math.hypot(info.p.x - ox * 6, info.p.z) * 1.0 + 4;
    const sigLat = dist * Math.tan(kEst * (HPO.cfg.TUNE.errPhi || 1) * Math.PI / 180);
    const wise = 0.6 + 0.6 * lvl(p.attrs.tactics);
    const marginD = U.clamp(0.4 + 0.35 * (m.risk - 1) + wise * T.riskMargin * 1.2 * sigLat, 0.6, 2.4);
    const marginZ = U.clamp(0.3 + 0.25 * (m.risk - 1) + wise * T.riskMargin * 1.0 * sigLat, 0.45, 2.0);
    const rr = rgn();
    const cands = [];
    const clampT = t => ({ x: U.clamp(t.x, ox * 0, ox * 99), z: t.z });
    const addAim = (dx, z, tag) => cands.push({ x: ox * dx, z: U.clamp(z, -5 + marginZ, 5 - marginZ), tag: tag });
    const weak = ops.slice().sort((a, b) => weakness(b) - weakness(a))[0];
    let kindDepth;
    const effortBase = 0.35 + 0.3 * (m.flat - 0.8) + 0.2 * lvl(p.attrs.power);
    let effort = U.clamp(effortBase, 0.2, 0.9);
    effort = U.clamp(effort + 0.25 * (lvl(p.attrs.power) - 0.5), 0.15, 0.95); // power buys pace

    if (LOB[kind] || kind === 'wallDef') {
      const d = 10 - marginD - (kind === 'lobOff' ? 1.2 : 1.7);
      [-3, -1.2, 1.2, 3].forEach(z => addAim(d, z + rr.range(-0.4, 0.4), 'lob'));
      effort = kind === 'lobOff' ? 0.5 : 0.35;
    } else if (SMASH[kind]) {
      const sk = kind === 'smashKick';
      [[3.2, -3.4], [3.2, 3.4], [5.5, 0], [4.5, -2.2], [4.5, 2.2]].forEach(a => addAim(a[0], a[1], 'smash'));
      if (sk) { addAim(5.2, -5 + marginZ, 'glass'); addAim(5.2, 5 - marginZ, 'glass'); }
      effort = 0.75 + 0.25 * lvl(p.attrs.power);
    } else if (kind === 'chiquita') {
      ops.filter(q => Math.abs(q.pos.x) < 4.5).forEach(q => addAim(2.4 + rr.range(0, 0.8), q.pos.z + rr.range(-0.6, 0.6), 'feet'));
      addAim(2.6, -1.8, 'feet'); addAim(2.6, 1.8, 'feet'); addAim(3.0, 0, 'mid');
      effort = 0.4;
    } else if (kind === 'dejada') {
      addAim(1.7, -2.2, 'drop'); addAim(1.7, 2.2, 'drop'); addAim(2.0, 0, 'drop');
      effort = 0.3;
    } else if (kind === 'bandeja') {
      addAim(10 - marginD - 1.0, -2.4, 'deep'); addAim(10 - marginD - 1.0, 2.4, 'deep'); addAim(10 - marginD - 1.4, 0, 'deepmid');
      effort = 0.45;
    } else if (kind === 'vibora') {
      addAim(9 - marginD, -4.2 + 0.2, 'wallside'); addAim(9 - marginD, 4.2 - 0.2, 'wallside'); addAim(6.5, -3, 'wide'); addAim(6.5, 3, 'wide');
      effort = 0.6;
    } else if (kind === 'bajada') {
      addAim(6.0, -3.2, 'angle'); addAim(6.0, 3.2, 'angle'); addAim(7.5, 0, 'mid'); addAim(8, -2, 'deep'); addAim(8, 2, 'deep');
      effort = 0.6;
    } else if (kind.indexOf('volley') === 0) {
      [[6.5, -3.0], [6.5, 3.0], [8.5, -1.8], [8.5, 1.8], [5.0, 0]].forEach(a => addAim(a[0] - marginD * 0.4, a[1], 'volley'));
      effort = 0.5;
    } else { // ground strokes, slice, counterattack
      const dd = 10 - marginD - 1.2;
      [[dd, -3.2, 'cross'], [dd, 3.2, 'cross'], [dd, 0, 'mid'], [dd - 1.5, -2, 'line'], [dd - 1.5, 2, 'line'], [5.5, 0, 'short']].forEach(a => addAim(a[0], a[1], a[2]));
      effort = U.clamp(effortBase + (kind === 'counterDW' ? 0.2 : 0), 0.25, 0.95);
    }

    let best = cands[0], bs = -1e9;
    const aimOrder = tm.orders.aimPoint && tm.orders.aimPoint.expires > now ? tm.orders.aimPoint : null;
    cands.forEach(function (c) {
      let s = 0;
      let dmin = 99; ops.forEach(q => { dmin = Math.min(dmin, Math.hypot(q.pos.x - c.x, q.pos.z - c.z)); });
      s += Math.min(dmin, 5) * (c.tag === 'feet' ? -0.2 : 0.5);
      if (c.tag === 'feet') s += 1.0;
      if (weak) { const dw = Math.hypot(weak.pos.x - c.x, weak.pos.z - c.z); s += (tm.orders.preset === 'focusOne' || tm.orders.focusOpponent !== undefined) ? Math.max(0, 3 - dw) * 0.8 : Math.max(0, 3 - dw) * 0.25 * weakness(weak); }
      if (m.middle) s += (1.5 - Math.abs(c.z)) * 0.8;
      if (m.glass && (c.tag === 'glass' || c.tag === 'wallside' || Math.abs(c.z) > 2.8)) s += 1.2;
      s -= Math.abs(c.z) > 5 - marginZ ? 1 : 0;
      s += rr.range(-1, 1) * T.aimNoise * (1.2 - lvl(p.attrs.tactics));
      if (aimOrder) s -= Math.hypot(aimOrder.x - c.x, aimOrder.z - c.z) * 0.9;
      if (s > bs) { bs = s; best = c; }
    });
    let target = { x: best.x, z: best.z };
    if (aimOrder) { // coach click: honoured only if the shot can really go there
      const nomO = S.nominal(info.p, kind, { x: aimOrder.x, z: aimOrder.z }, { effort: effort });
      if (nomO.feasible && S.difficulty(kind, info.height, info.ballSpeed, 0) < 0.85) { target = { x: aimOrder.x, z: aimOrder.z }; tm.orders.aimPoint = null; }
    }
    const intent = LOB[kind] || kind === 'wallDef' ? 'defend' : (SMASH[kind] || kind === 'vibora' ? 'attack' : (SOFT[kind] ? 'finesse' : 'rally'));
    return { kind: kind, target: target, effort: effort, intent: intent, reason: best.tag, netMargin: U.clamp(0.10 + 0.05 * kEst, 0.1, 0.45) };
  }

  function weakness(q) { return (1 - lvl(q.attrs.defense)) * 0.6 + q.fatigue * 0.5 + (1 - q.confidence) * 0.2; }

  function tickTeam(team, dt) {
    const P = HPO.mod.players, B = HPO.mod.ball.state, tm = teams[team];
    const ps = P.team(team); if (ps.length < 2) return;
    const sx = HPO.court.sides[team];
    updateFormation(team);

    const incoming = B.state === 'live' && B.lastHitTeam !== team && B.lastHitTeam !== null;
    const serveReturn = incoming && B.hitsSinceServe === 1;
    let roles = null;
    if (incoming) {
      if (now - assignAt[team] > 0.08) { assignAt[team] = now; roles = pickInterceptor(team, ps.filter(q => !q.scripted).length ? ps.filter(q => !q.scripted) : ps); tm.roles = roles; }
      roles = tm.roles;
    } else { tm.claim = null; tm.roles = null; }

    const pos = formationPositions(team, ps, roles);
    ps.forEach(function (p) {
      if (p.scripted) return;                                   // out-of-court retriever etc. are driven by the match flow
      if (roles && p === roles.interceptor) { p.intent = roles.cands ? { type: 'intercept' } : { type: 'move', x: roles.chase.x, z: roles.chase.z, cap: 1 }; }
      else {
        const t = pos[p.id];
        const arrive = tm.formation === 'attack' ? 0.9 : 0.8;
        const tx = serveReturn ? sx * Math.max(Math.abs(t.x), SERVE_BACK) : t.x;
        p.intent = { type: 'move', x: tx, z: t.z, cap: arrive };
      }
    });
  }

  function pickInterceptor(team, ps) {
    const tm = teams[team];
    const B = HPO.mod.ball.state;
    const P = HPO.mod.players;
    const res = ps.map(function (p) {
      const c = P.candidates(p);
      return { p: p, c: c, first: c.length ? c[0] : null };
    });
    const bz = B.p.z;
    let best = null, bs = -1e9;
    res.forEach(function (r) {
      let s;
      if (r.first) {
        s = 3 - r.first.dt * 1.0 + Math.min(r.first.slack, 0.6);
        s += (tm.claim === r.p.id ? 0.35 : 0);
        const rv = P.rightVec(team);
        const lat = (r.first.p.x - r.p.pos.x) * rv.x + (r.first.p.z - r.p.pos.z) * rv.z;
        s += (r.p.hand === 'R' ? lat > 0 : lat < 0) ? 0.1 : 0;
        s += lvl(r.p.attrs.coverage) * 0.1;
        if (Math.abs(r.first.p.z) < 1.1) {
          const mp = tm.orders.middlePriority;
          if (mp !== undefined && P.team(team)[mp] === r.p) s += 0.35;
          else s += lvl(r.p.attrs.tactics) * 0.08;
        }
        if (B.hitsSinceServe === 1 && HPO.mod.rules && HPO.mod.rules.expectedReceiver && HPO.mod.rules.expectedReceiver() === r.p.id) s += 1.5;
        if (B.v.y > -1 && B.p.y > 3 && Math.abs(r.p.pos.x) < Math.abs(r.first.p.x) - 3) s -= 0.4;
      } else {
        const e = ballEnd();
        s = -10 - Math.hypot(r.p.pos.x - e.x, r.p.pos.z - e.z) * 0.2;
      }
      if (s > bs) { bs = s; best = r; }
    });
    tm.claim = best.p.id;
    const e = ballEnd(); const sx = HPO.court.sides[team];
    return { interceptor: best.p, supporter: ps.find(q => q !== best.p), cands: best.first ? best.c : null, chase: { x: U.clamp(e.x, sx < 0 ? -9.4 : 0.8, sx < 0 ? -0.8 : 9.4), z: U.clamp(e.z, -4.4, 4.4) } };
  }
  function ballEnd() {
    const pr = HPO.mod.ball.predict(null, 3, 20);
    const s = pr.samples; return s.length ? s[s.length - 1].p : HPO.mod.ball.state.p;
  }

  const BASE = { attack: [2.2, 2.2], neutral: [2.8, 5.6], defend: [7.0, 7.0] };
  const SERVE_BACK = 7.6; // metres from the net: just behind the 6.95 m service line

  function updateFormation(team) {
    const tm = teams[team], B = HPO.mod.ball.state, m = mods(team);
    if (B.state !== 'live') return;
    const sx = HPO.court.sides[team];
    let want = tm.formation;
    const ls = lastShot;
    if (ls) {
      if (ls.team !== team) {
        if (LOB[ls.kind] && ls.quality > 0.35) want = 'defend';
        else if (SMASH[ls.kind] || ls.kind === 'vibora') want = 'defend';
        else if (ls.kind === 'bandeja') want = 'neutral';
        else if (ls.quality < 0.45 && Math.abs(B.p.x) < 6) want = 'attack'; // weak reply: step up
        else if (SOFT[ls.kind]) want = 'neutral';
        else want = ls.fast ? 'neutral' : tm.formation === 'defend' ? 'neutral' : tm.formation;
      } else {
        if (LOB[ls.kind]) want = ls.kind === 'lobDef' ? 'neutral' : 'attack';
        else if (SOFT[ls.kind] || ls.kind.indexOf('volley') === 0 || SMASH[ls.kind] || ls.kind === 'bandeja' || ls.kind === 'vibora') want = 'attack';
        else if (ls.kind === 'wallDef' || ls.kind === 'bajada') want = 'neutral';
        else want = ls.hitterDepth > 5.5 ? 'neutral' : tm.formation;
      }
    }
    if (m.netBias > 0 && want === 'neutral') want = 'attack';
    if (m.netBias < 0 && want === 'attack') want = 'neutral';
    const urgent = want === 'defend' && tm.formation !== 'defend';
    if (want !== tm.formation && (urgent || now - tm.since > 1.2)) {
      tm.formation = want; tm.since = now; BUS.emit('ai:formation', { team: team, formation: want });
    }

  const INTER = {

  function makeEngine(seed) {

  function emitLine(ln, feedKind, icon) {
